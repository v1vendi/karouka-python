<!doctype html>
<html>
<head>
<style>
  @font-face { font-family: "Demo"; src: url("../fonts/NotoSans-Regular.ttf"); }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: rgb(24, 26, 34);
    font-family: "Demo";
  }
  .card {
    display: block;
    width: 360px;
    height: 60px;
    background: rgb(40, 44, 58);
    border: 2px solid rgb(70, 76, 96);
    transition: background 0.4s, border-color 0.4s;
  }
  .card:hover {
    background: rgb(58, 90, 140);
    border-color: rgb(120, 170, 240);
  }
  .card.script-ran {
    border-color: rgb(255, 0, 255);
  }
  .checkbox {
    display: block;
    width: 28px;
    height: 28px;
    background: rgb(50, 54, 68);
    border: 2px solid rgb(90, 96, 116);
  }
  .checkbox:checked {
    background: rgb(80, 200, 120);
    border-color: rgb(140, 240, 180);
  }
  .field {
    display: block;
    width: 320px;
    height: 34px;
    background: rgb(20, 22, 30);
    border: 2px solid rgb(80, 86, 106);
    color: rgb(230, 230, 236);
  }
  .field:focus {
    border-color: rgb(120, 170, 240);
  }
  .pulse {
    display: block;
    width: 48px;
    height: 48px;
    background: rgb(240, 120, 90);
    border-radius: 8px;
  }
  .label {
    color: rgb(200, 202, 210);
  }
</style>
</head>
<body>
  <div id="hoverCard" class="card"></div>
  <input id="agree" type="checkbox" class="checkbox" tabindex="0">
  <input id="nameField" type="text" class="field" tabindex="0">
  <div id="pulseBox" class="pulse"></div>
  <script>
    // Real DOM script driving a real Element: querySelector and classList
    // both reach the live document (M2-46, M2-51, M2-52).
    document.querySelector("#hoverCard").classList.add("script-ran");

    // Web Animations API: Element.animate() constructs and plays a real
    // native Animation against this element (M2-37, M2-54). Its return
    // value is kept alive in a variable deliberately -- a discarded
    // reference lets the engine's own object-lifetime model reclaim the
    // Animation before it ever advances, the same "a playing effect must
    // stay alive independent of a script reference" rule real engines
    // enforce and this one does not yet.
    var pulse = document.querySelector("#pulseBox");
    var pulseAnimation = pulse
      ? pulse.animate([ { opacity: 1.0 }, { opacity: 0.25 } ], 2000)
      : null;
  </script>
</body>
</html>
